name: windows-exe-release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Immutable release tag matching the candidate manifest, for example v0.1.32"
        required: true
        type: string
      candidate_run_id:
        description: "Successful windows-ci run ID for the main commit being promoted"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: arkline-release
  cancel-in-progress: false

jobs:
  promote-release:
    name: Release / Promote Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read

    steps:
      - name: Validate successful main candidate run
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          if [[ ! "$CANDIDATE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "candidate_run_id must be numeric" >&2
            exit 1
          fi

          run_json="$(gh api "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN_ID")"
          workflow_path="$(jq -r '.path' <<<"$run_json")"
          event="$(jq -r '.event' <<<"$run_json")"
          head_branch="$(jq -r '.head_branch' <<<"$run_json")"
          conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          commit_sha="$(jq -r '.head_sha' <<<"$run_json")"
          if [[ "$workflow_path" != ".github/workflows/windows-ci.yml" || "$event" != "push" || "$head_branch" != "main" || "$conclusion" != "success" ]]; then
            echo "candidate must be a successful windows-ci push run on main" >&2
            exit 1
          fi

          ready_conclusion="$(gh api --paginate "repos/$GH_REPO/actions/runs/$CANDIDATE_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Release Ready") | .conclusion' | tail -n 1)"
          if [[ "$ready_conclusion" != "success" ]]; then
            echo "candidate run has no successful Release Ready job" >&2
            exit 1
          fi
          echo "commit_sha=$commit_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout candidate verifier
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.candidate.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download release candidate
        uses: actions/download-artifact@v5
        with:
          name: arkline-windows-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Verify candidate identity and digests
        id: verify
        env:
          ARKLINE_CANDIDATE_ROOT: ${{ github.workspace }}/candidate
          ARKLINE_RELEASE_TAG: ${{ inputs.release_tag }}
          ARKLINE_CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: node scripts/verify-release-candidate.mjs

      - name: Require a new tag or recover the same stale draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          if existing_json="$(gh release view "$RELEASE_TAG" --json isDraft,targetCommitish 2>/dev/null)"; then
            is_draft="$(jq -r '.isDraft' <<<"$existing_json")"
            target="$(jq -r '.targetCommitish' <<<"$existing_json")"
            if [[ "$is_draft" != "true" || "$target" != "$CANDIDATE_SHA" ]]; then
              echo "release already exists or belongs to another candidate: $RELEASE_TAG" >&2
              exit 1
            fi
            gh release delete "$RELEASE_TAG" --yes --cleanup-tag
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Create draft with both verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
          INSTALLER_PATH: "${{ steps.verify.outputs.installer_path }}"
          PORTABLE_PATH: "${{ steps.verify.outputs.portable_path }}"
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$INSTALLER_PATH" "$PORTABLE_PATH" \
            --draft \
            --target "$CANDIDATE_SHA" \
            --title "$RELEASE_TAG" \
            --notes "ArkLine Windows candidate from commit $CANDIDATE_SHA, verified by windows-ci run $CANDIDATE_RUN_ID."

      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,targetCommitish,assets)"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$CANDIDATE_SHA" '
            .tagName == $tag and
            .isDraft == true and
            .targetCommitish == $sha and
            ([.assets[].name] | sort) == (["ArkLine-windows-x64.zip", ("ArkLine_" + ($tag | ltrimstr("v")) + "_x64-setup.exe")] | sort)
          ' <<<"$release_json" >/dev/null

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.commit_sha }}
        run: |
          set -euo pipefail
          release_json="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,targetCommitish,assets)"
          jq -e --arg tag "$RELEASE_TAG" --arg sha "$CANDIDATE_SHA" '
            .tagName == $tag and
            .isDraft == false and
            .targetCommitish == $sha and
            ([.assets[].name] | sort) == (["ArkLine-windows-x64.zip", ("ArkLine_" + ($tag | ltrimstr("v")) + "_x64-setup.exe")] | sort)
          ' <<<"$release_json" >/dev/null
