name: windows-ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: arkline-ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  quality:
    name: Quality Gate / Fast
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install Linux desktop dependencies
        run: bash scripts/install-tauri-linux-deps.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TDD impact advisory
        continue-on-error: true
        env:
          ARKLINE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm test:impact:advisory -- --base="$ARKLINE_BASE_SHA" --head="$GITHUB_SHA"

      - name: Run fast quality gate
        run: pnpm check:fast

      - name: Reconcile TDD impact evidence
        if: always()
        continue-on-error: true
        run: pnpm test:impact:reconcile

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkline-quality-gate
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 90

  release-frontend:
    name: Release Candidate / Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release frontend gate
        run: pnpm check:release:frontend

      - name: Upload release frontend evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkline-release-frontend-gate
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

  package:
    name: Windows / Package
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows candidate packages
        run: pnpm package:windows:candidate

      - name: Write release candidate manifest
        run: node scripts/release-candidate-manifest.mjs

      - name: Upload candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arkline-windows-candidate
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            dist/ArkLine-windows-x64.zip
            artifacts/release-candidate-manifest.json
          if-no-files-found: error

  candidate-smoke:
    name: Release Candidate / Windows Smoke
    needs: package
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish PowerShell host path
        shell: pwsh
        run: |
          $hostPath = Join-Path $PSHOME "pwsh.exe"
          if (-not (Test-Path -LiteralPath $hostPath -PathType Leaf)) {
            throw "PowerShell host was not found at $hostPath"
          }
          "ARKLINE_POWERSHELL_PATH=$hostPath" >> $env:GITHUB_ENV

      - name: Install pinned Edge driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $driverPath = Join-Path $PWD.Path "msedgedriver.exe"
          if (-not (Test-Path -LiteralPath $driverPath -PathType Leaf)) {
            throw "Edge driver was not installed at $driverPath"
          }
          "ARKLINE_EDGEDRIVER=$driverPath" >> $env:GITHUB_ENV

      - name: Download candidate artifacts
        uses: actions/download-artifact@v5
        with:
          name: arkline-windows-candidate
          path: artifacts/candidate-download

      - name: Verify and expand portable candidate
        shell: pwsh
        run: |
          $archive = "artifacts/candidate-download/dist/ArkLine-windows-x64.zip"
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) {
            throw "Portable candidate was not downloaded at $archive"
          }
          Expand-Archive -LiteralPath $archive -DestinationPath artifacts/release-verify
          foreach ($requiredFile in @(
            "artifacts/release-verify/ArkLine.exe",
            "artifacts/release-verify/arkline-semantic.exe",
            "artifacts/release-verify/arkline-indexer.exe"
          )) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Portable candidate is missing $requiredFile"
            }
          }

      - name: Install candidate silently
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath VERSION -Raw).Trim()
          $installer = "artifacts/candidate-download/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/ArkLine_${version}_x64-setup.exe"
          if (-not (Test-Path -LiteralPath $installer -PathType Leaf)) {
            throw "Installer candidate was not downloaded at $installer"
          }
          $installRoot = Join-Path $env:RUNNER_TEMP "ArkLine-Candidate"
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $installer -ArgumentList @("/S", "/D=$installRoot") -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installer exited with $($process.ExitCode)"
          }
          foreach ($requiredFile in @("ArkLine.exe", "arkline-semantic.exe", "arkline-indexer.exe")) {
            $installedFile = Join-Path $installRoot $requiredFile
            if (-not (Test-Path -LiteralPath $installedFile -PathType Leaf)) {
              throw "Installed candidate is missing $installedFile"
            }
          }
          "ARKLINE_CANDIDATE_INSTALL_ROOT=$installRoot" >> $env:GITHUB_ENV
          "ARKLINE_INSTALLED_APPLICATION=$(Join-Path $installRoot 'ArkLine.exe')" >> $env:GITHUB_ENV

      - name: Checkout pinned real Harmony project
        uses: actions/checkout@v4
        with:
          repository: Joker-x-dev/CoolMallArkTS
          ref: 17b6899086a57a4d48448842a14f9e325e3e35a3
          path: artifacts/real-harmony-project

      - name: Run installed candidate semantic smoke
        shell: pwsh
        run: |
          pnpm perf:packaged:windows -- `
            --mode=smoke `
            --max-cycles=5 `
            --application="$env:ARKLINE_INSTALLED_APPLICATION" `
            --driver="$env:ARKLINE_EDGEDRIVER" `
            --fixture=artifacts/real-harmony-project `
            --scenario=docs/performance-fixtures/core-loop-coolmall-v1.json `
            --sdk=semantic-worker/fixtures/golden-corpus/v1/sdk/openharmony `
            --report=artifacts/installed-candidate-report.json `
            --strict

      - name: Run portable candidate semantic smoke
        shell: pwsh
        run: |
          pnpm perf:packaged:windows -- `
            --mode=smoke `
            --max-cycles=5 `
            --application=artifacts/release-verify/ArkLine.exe `
            --driver="$env:ARKLINE_EDGEDRIVER" `
            --fixture=artifacts/real-harmony-project `
            --scenario=docs/performance-fixtures/core-loop-coolmall-v1.json `
            --sdk=semantic-worker/fixtures/golden-corpus/v1/sdk/openharmony `
            --report=artifacts/portable-candidate-report.json `
            --strict

      - name: Uninstall candidate
        if: always()
        shell: pwsh
        run: |
          if (-not $env:ARKLINE_CANDIDATE_INSTALL_ROOT) { exit 0 }
          $uninstaller = Join-Path "$env:ARKLINE_CANDIDATE_INSTALL_ROOT" "uninstall.exe"
          if (Test-Path -LiteralPath $uninstaller -PathType Leaf) {
            Start-Process -FilePath $uninstaller -ArgumentList "/S" -Wait
          }

      - name: Upload candidate smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkline-release-candidate-smoke
          path: artifacts/*-candidate-report.json
          if-no-files-found: warn
          retention-days: 30

  merge-ready:
    name: Merge Ready
    if: ${{ always() }}
    needs:
      - quality
      - release-frontend
      - package
      - candidate-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every merge gate
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          FRONTEND_RESULT: ${{ needs.release-frontend.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SMOKE_RESULT: ${{ needs.candidate-smoke.result }}
        run: |
          failed=0
          for result in \
            "Quality Gate / Fast=$QUALITY_RESULT" \
            "Release Candidate / Frontend=$FRONTEND_RESULT" \
            "Windows / Package=$PACKAGE_RESULT" \
            "Release Candidate / Windows Smoke=$SMOKE_RESULT"
          do
            echo "$result"
            if [[ "${result##*=}" != "success" ]]; then
              failed=1
            fi
          done
          exit "$failed"

  release-ready:
    name: Release Ready
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: merge-ready
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Mark candidate release-ready
        run: echo "ARKLINE_RELEASE_READY ${{ github.sha }}"
