name: macos-windows-exe

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional GitHub Release tag to upload ArkLine-windows-x64.zip to"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: arkline-release-${{ github.event.inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-windows-exe:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install cargo-xwin
        run: cargo install --locked cargo-xwin

      - name: Install Windows resource compiler
        run: |
          brew untap aws/tap || true
          brew install llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          test -x "$(brew --prefix llvm)/bin/llvm-rc"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full release quality gate
        run: pnpm check

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkline-release-quality-gate
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Build Windows portable exe
        run: pnpm package:windows:portable

      - name: Verify portable bundle
        run: |
          test -f dist/ArkLine-windows-x64.zip
          ditto -x -k dist/ArkLine-windows-x64.zip /tmp/arkline-portable
          test -f /tmp/arkline-portable/ArkLine-windows-x64/ArkLine.exe
          test -f /tmp/arkline-portable/ArkLine-windows-x64/arkline-semantic.exe
          test -f /tmp/arkline-portable/ArkLine-windows-x64/arkline-indexer.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArkLine-windows-x64
          path: dist/ArkLine-windows-x64.zip
          if-no-files-found: error

  publish-release:
    name: Release / Publish
    if: ${{ github.event.inputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v') }}
    needs: build-windows-exe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download verified portable bundle
        uses: actions/download-artifact@v4
        with:
          name: ArkLine-windows-x64
          path: dist

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag != '' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes "ArkLine Windows portable build."
          gh release upload "$RELEASE_TAG" dist/ArkLine-windows-x64.zip --clobber
