name: windows-packaged-soak

on:
  workflow_dispatch:
    inputs:
      fixture_profile:
        description: "Synthetic ArkTS workspace size"
        required: true
        default: medium
        type: choice
        options:
          - small
          - medium
          - huge
      duration_minutes:
        description: "Mixed interaction soak duration"
        required: true
        default: "30"
        type: string
      run_full_soak:
        description: "Run protocol and mixed interaction soak before semantic smoke"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: arkline-windows-packaged-soak
  cancel-in-progress: false

jobs:
  packaged-soak:
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        lane:
          - packaged-soak

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Publish PowerShell host path
        shell: pwsh
        run: |
          $hostPath = Join-Path $PSHOME "pwsh.exe"
          if (-not (Test-Path -LiteralPath $hostPath)) {
            throw "PowerShell host was not found at $hostPath"
          }
          "ARKLINE_POWERSHELL_PATH=$hostPath" >> $env:GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Edge driver
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $driverPath = Join-Path $PWD.Path "msedgedriver.exe"
          if (-not (Test-Path -LiteralPath $driverPath)) {
            throw "Edge driver was not installed at $driverPath"
          }
          "ARKLINE_EDGEDRIVER=$driverPath" >> $env:GITHUB_ENV

      - name: Build release portable application
        run: pnpm package:windows:portable

      - name: Generate protocol smoke workspace
        if: ${{ inputs.run_full_soak }}
        shell: pwsh
        run: |
          pnpm fixture:performance -- `
            --profile=small `
            --output=artifacts/packaged-smoke-fixture

      - name: Run packaged protocol smoke
        if: ${{ inputs.run_full_soak }}
        shell: pwsh
        env:
          ARKLINE_INDEXER_ENABLED: "0"
        run: |
          pnpm perf:packaged:windows -- `
            --mode=smoke `
            --application=dist/ArkLine-windows-x64/ArkLine.exe `
            --driver="$env:ARKLINE_EDGEDRIVER" `
            --fixture=artifacts/packaged-smoke-fixture `
            --report=artifacts/packaged-smoke-report.json

      - name: Generate performance workspace
        if: ${{ inputs.run_full_soak }}
        shell: pwsh
        run: |
          pnpm fixture:performance -- `
            --profile=${{ inputs.fixture_profile }} `
            --output=artifacts/packaged-soak-fixture

      - name: Run packaged mixed interaction soak
        if: ${{ inputs.run_full_soak }}
        shell: pwsh
        run: |
          pnpm perf:packaged:windows -- `
            --mode=soak `
            --application=dist/ArkLine-windows-x64/ArkLine.exe `
            --driver="$env:ARKLINE_EDGEDRIVER" `
            --fixture=artifacts/packaged-soak-fixture `
            --duration-minutes=${{ inputs.duration_minutes }} `
            --report=artifacts/packaged-soak-report.json `
            --strict

      - name: Checkout pinned real Harmony project
        uses: actions/checkout@v4
        with:
          repository: Joker-x-dev/CoolMallArkTS
          ref: 17b6899086a57a4d48448842a14f9e325e3e35a3
          path: artifacts/real-harmony-project

      - name: Run packaged real-project semantic smoke
        shell: pwsh
        run: |
          pnpm perf:packaged:windows -- `
            --mode=smoke `
            --max-cycles=5 `
            --application=dist/ArkLine-windows-x64/ArkLine.exe `
            --driver="$env:ARKLINE_EDGEDRIVER" `
            --fixture=artifacts/real-harmony-project `
            --scenario=docs/performance-fixtures/core-loop-coolmall-v1.json `
            --sdk=semantic-worker/fixtures/golden-corpus/v1/sdk/openharmony `
            --report=artifacts/packaged-real-project-report.json `
            --strict

      - name: Upload packaged evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkline-packaged-soak-evidence
          path: artifacts/packaged-*-report.json
          if-no-files-found: warn
          retention-days: 30
